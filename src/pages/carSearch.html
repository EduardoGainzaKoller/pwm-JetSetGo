<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Busqueda - Hoteles</title>
  <link rel="stylesheet" href="../assests/css/flightSearch.css">
  <script src="../assests/js/loadTemplate.js"></script>
  <script src="../assests/js/loadGeneralStructure.js"></script>
  <script src="../assests/js/loadJsonData.js"></script>
</head>

<body>
<header id="header"></header>

<div id="searchBar"></div>

<div class="content-page">
  <div id="filters"></div>

  <ul class="flights-results" id="cars"></ul>
</div>


<footer id="footer"></footer>

<script>
  loadGeneralStructure([
    { id: 'header', templatePath: '../templates/header.html' },
    { id: 'footer', templatePath: '../templates/footer.html' },
    { id: 'searchBar', templatePath: '../templates/search-car-bar.html' },
    { id: 'filters', templatePath: '../templates/filters.html'}
  ]).then(() => {
    loadTemplatesWithData([
      {
        id: 'cars',
        templatePath: '../templates/cars.html',
        dataPath: '../assests/Json/cars.json',
        repeat: true,
        dataMapping: {
          'precio_por_dia': '.coche-precio',
          'modelo': '.nombre-coche',
          'descripcion': '.descripcion-coche',
          'valoracion': '.valoracion-coche',
        },
        dataTransform: (item) => {
          return {
            precio_por_dia: `${item.precio_por_dia.toFixed(2)} €`,
            modelo: `${item.marca} ${item.modelo}`,
            descripcion: item.descripcion,
            valoracion: `Valoración: ${item.valoracion}`,
          };
        }
      }
    ]);
  });
</script>
</body>

</html>
