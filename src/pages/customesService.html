<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JetSetGo - Atención al cliente</title>

  <script src="../assests/js/loadTemplate.js"></script>
  <script src="../assests/js/loadGeneralStructure.js"></script>

  <link rel="stylesheet" href="../assests/css/customerService.css">
</head>

<body>

<header id="header"></header>

<main>
  <section class="contact-form">
    <div class="form-container">
      <form id="contactForm">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre">
        <div class="error-message" id="error-nombre"></div>

        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" name="apellidos">
        <div class="error-message" id="error-apellidos"></div>

        <label for="email">Dirección de e-mail</label>
        <input type="email" id="email" name="email">
        <div class="error-message" id="error-email"></div>

        <label for="mensaje">Tu mensaje</label>
        <textarea id="mensaje" name="mensaje"></textarea>
        <div class="error-message" id="error-mensaje"></div>

        <button type="submit">Enviar</button>
      </form>
    </div>
  </section>
</main>

<footer id="footer"></footer>

<script>
  loadGeneralStructure([
    { id: 'header', templatePath: '../templates/header.html' },
    { id: 'footer', templatePath: '../templates/footer.html' }
  ]);

  document.getElementById("contactForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const fields = ["nombre", "apellidos", "email", "mensaje"];
    let isValid = true;

    fields.forEach(field => {
      const input = document.getElementById(field);
      const errorDiv = document.getElementById(`error-${field}`);

      if (input.value.trim() === "") {
        errorDiv.textContent = `Por favor, rellena este campo.`;
        input.classList.add("input-error");
        isValid = false;
      } else {
        errorDiv.textContent = "";
        input.classList.remove("input-error");
      }
    });

    if (isValid) {
      alert("Formulario enviado correctamente.");
      this.submit();
    }
  });
</script>

</body>

</html>
