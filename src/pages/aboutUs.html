<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JetSetGo - Soporte</title>

    <script src="../assests/js/loadTemplate.js"></script>
    <script src="../assests/js/loadGeneralStructure.js"></script>
    <script src="../assests/js/aboutUs.js" defer></script>

    <link rel="stylesheet" href="../assests/css/footer-section.css">
    <link rel="stylesheet" href="../assests/css/aboutUs.css">
</head>

<body>
<header id="header"></header>

<div class="page-container">
    <div class="upper-content">
        <img src="../assests/images/Destino_generico.jpeg" alt="footer-section">
        <h2>¿Quienes Somos?</h2>
    </div>

    <div class="lower-content" id="lower-content">

    </div>
</div>

<footer id="footer"></footer>


<script>
    function getUserSession() {
        return localStorage.getItem('usuarioLogueado');
    }

    function loadHeader() {
        const headerTemplate = getUserSession()
            ? '../templates/headerUser.html'
            : '../templates/header.html';

        return loadGeneralStructure([
            { id: 'header', templatePath: headerTemplate },
            { id: 'footer', templatePath: '../templates/footer.html' },
            { id: 'searchBar', templatePath: '../templates/search-hotel-bar.html' }
        ]).then(() => {
            if (getUserSession()) {
                const user = JSON.parse(localStorage.getItem('usuarioLogueado'));
                const userEmail = user.email;

                const userNameElement = document.getElementById('user-name');
                if (userNameElement) {
                    userNameElement.textContent = userEmail;
                }
            }
        });
    }
    loadHeader()
</script>

</body>

</html>
