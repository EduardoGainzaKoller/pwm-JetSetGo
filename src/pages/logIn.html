<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JetSetGo - Inicio de Sesión</title>
  <link rel="stylesheet" href="../assests/css/logIn.css">

  <script src="../assests/js/loadTemplate.js"></script>
  <script src="../assests/js/loadGeneralStructure.js"></script>
</head>

<body>
<header id="header"></header>

<main class="login-container main-content">
<h2>Inicio de sesión</h2>
  <p>Inicia sesión con tu cuenta de JetSetGo.com para obtener más ofertas</p>
  <form>
    <label for="email">E-mail y contraseña</label>
    <input type="email" id="email" placeholder="Indica tu e-mail" required>
    <input type="password" id="password" placeholder="Indica tu contraseña" required>

    <button class="login" type="submit">Iniciar sesión</button>
  </form>

  <div class="alternative-login">
    <p>— o usar una de estas opciones —</p>
    <div class="social-icons">
      <img src="../assests/Images/google.png">
      <img src="../assests/Images/apple.png">
    </div>
  </div>
</main>

<footer id="footer"></footer>


<script>
  loadGeneralStructure([
    { id: 'header', templatePath: '../templates/header.html' },
    { id: 'footer', templatePath: '../templates/footer.html' }
  ])
</script>

<script src="../assests/js/logIn.js"></script>

</body>

</html>
