<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Busqueda - Hoteles</title>
  <link rel="stylesheet" href="../assests/css/flightSearch.css">
  <script src="../assests/js/loadTemplate.js"></script>
  <script src="../assests/js/loadGeneralStructure.js"></script>
  <script src="../assests/js/loadJsonData.js"></script>
</head>

<body>
  <header id="header"></header>

  <div id="searchBar"></div>

  <div class="content-page">
    <div id="filters"></div>

    <ul class="flights-results" id="hotels">
    </ul>
  </div>


  <footer id="footer"></footer>

  <script>

    function getUserSession() {
      return localStorage.getItem('usuarioLogueado');
    }

    function loadHeader() {
      const headerTemplate = getUserSession()
              ? '../templates/headerUser.html'
              : '../templates/header.html';

      return loadGeneralStructure([
        { id: 'header', templatePath: headerTemplate },
        { id: 'footer', templatePath: '../templates/footer.html' },
        { id: 'searchBar', templatePath: '../templates/search-hotel-bar.html' },
        { id: 'filters', templatePath: '../templates/filters.html' }
      ]).then(() => {
        if (getUserSession()) {
          const user = JSON.parse(localStorage.getItem('usuarioLogueado'));
          const userEmail = user.email;

          const userNameElement = document.getElementById('user-name');
          if (userNameElement) {
            userNameElement.textContent = userEmail;
          }
        }
      });
    }


    loadHeader().then(() => {
      loadTemplatesWithData([
        {
          id: 'hotels',
          templatePath: '../templates/hotels.html',
          dataPath: '../assests/Json/hotels.json',
          repeat: true,
          dataMapping: {
            'nombre_del_hotel': '.nombre-hotel',
            'precio': '.hotel-precio',
            'valoracion': '.valoracion-hotel',
            'imagen_hotel': '.hotel-icono'
          },
          dataTransform: (item) => {
            return {
              nombre_del_hotel: item.nombre_del_hotel,
              precio: `${item.precio.toFixed(2)} €`,
              valoracion: `valoración: ${item.valoracion}`,
              imagen_hotel: item.imagen_hotel
            };
          }
        }
      ]);
    });
  </script>
</body>

</html>
