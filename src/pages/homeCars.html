<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Hoteles</title>

    <script src="../assets/js/loadTemplate.js"></script>
    <script src="../assets/js/loadGeneralStructure.js"></script>
    <script src="../assets/js/loadJsonData.js"></script>

    <link rel="stylesheet" href="../assets/css/home.css">
</head>

<body>

<div id="header"></div>

<div class="UpperBackground">
    <img src="../assets/Images/FondoHome.jpg" alt="FondoHome">
</div>

<div id="searchBar"></div>

<div class="Offer-section">
    <h2 id="HeaderOferta"><b>OFERTAS</b></h2>
    <div>
        <ul class="Offers" id="OffersList"></ul>
    </div>
</div>

<div id="footer"></div>

<script>
    loadGeneralStructure([
        { id: 'header', templatePath: '../templates/header.html' },
        { id: 'footer', templatePath: '../templates/footer.html' },
        { id: 'searchBar', templatePath: '../templates/search-car-bar.html' }
    ]).then(() => {
        loadTemplatesWithData([
            {
                id: 'OffersList',
                templatePath: '../templates/offers.html',
                dataPath: '../assests/Json/flights.json',
                repeat: true,
                dataMapping: {
                    'destino': '.oferta-destino',
                    'duracion': '.oferta-detalles',
                    'precio': '.oferta-precio strong',
                    'imagen_destino': '.oferta-img-container img'
                },
                dataTransform: (item) => {
                    return {
                        destino: item.destino,
                        duracion: `Duración: ${item.duracion}, Origen: ${item.origen}`,
                        precio: `${item.precio.toFixed(2)} €`,
                        imagen_destino: item.imagen_destino
                    };
                }
            }
        ]);
    });
</script>

</body>

</html>
