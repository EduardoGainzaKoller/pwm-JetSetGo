<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JetSetGo - Inicio de Sesión</title>
    <script src="../assets/js/loadTemplate.js"></script>
    <script src="../assets/js/loadGeneralStructure.js"></script>
    <link rel="stylesheet" href="../assets/css/logIn.css">
</head>

<body>
<header id="header"></header>

<main class="login-container main-content">
    <h2>Registrarse</h2>
    <p>Crear cuenta de JetSetGo.com para conseguir mejores ofertas</p>
    <form>
        <label for="email">E-mail y contraseña</label>
        <input type="email" id="email" placeholder="Indica tu e-mail" required>
        <input type="password" id="password" placeholder="Indica tu contraseña" required>

        <button class="login" type="submit">Registrarse</button>
    </form>

    <div class="alternative-login">
        <p>— o usar una de estas opciones —</p>
        <div class="social-icons">
            <img src="../assets/Images/google.png">
            <img src="../assets/Images/apple.png">
        </div>
    </div>
</main>

<footer id="footer"></footer>

<script>
    loadGeneralStructure([
        { id: 'header', templatePath: '../templates/header.html' },
        { id: 'footer', templatePath: '../templates/footer.html' }
    ])
</script>

<script src="../assets/js/signUp.js"></script>

</body>

</html>
